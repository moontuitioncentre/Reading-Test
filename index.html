<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<title>
Moon AI English Reading V4.1
</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>


body {

    margin:0;

    font-family:"Noto Sans SC",
    "Microsoft YaHei",
    sans-serif;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    height:100vh;

    transition:0.3s;

}



.card {

    font-size:clamp(35px, 12vw, 100px);

    margin-bottom:20px;

    text-align:center;

    white-space:nowrap;

    transform-origin:center;

}

@media(max-width:600px){

  .options {
    grid-template-columns:1fr;
  }


  .card{

    font-size:12vw;

  }

}



.pinyin {

    font-size:35px;

    color:#666;

    margin-bottom:30px;

}



button {

    font-size:24px;

    padding:12px 30px;

    margin:10px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}



.start-btn {

    background:#2196F3;

    color:white;

}



.stop-btn {

    background:#f44336;

    color:white;

}



.restart-btn {

    background:#333;

    color:white;

}



.range-btn {

    background:#4CAF50;

    color:white;

}



.skip-btn {

    background:#ff9800;

    color:white;

}



.result {

    font-size:28px;

    text-align:center;

    margin-top:20px;

}



.correct {

    background:#c8f7c5;

}



.incorrect {

    background:#ffcdd2;

}



.wrong-list {

    margin-top:20px;

    color:red;

    font-size:20px;

}


/* PASS / FAIL 设计 */

.pass-box,
.fail-box {

    font-size:50px;

    font-weight:bold;

    padding:30px;

    border-radius:25px;

    margin:20px;

    animation:pop 0.5s ease;

}


.pass-box {

    background:#d4ffd4;

    color:#2e7d32;

}


.fail-box {

    background:#ffd6d6;

    color:#c62828;

}


.pass-small,
.fail-small {

    font-size:25px;

    font-weight:normal;

}

.normal {

    background:white;

}

@keyframes pop {

    0% {

        transform:scale(0.5);

        opacity:0;

    }


    100% {

        transform:scale(1);

        opacity:1;

    }

}


</style>

</head>

<div class="card" id="word">

<div class="meaning" id="meaning">

<button id="startBtn" class="start-btn" onclick="startListening()">

</button>


<button class="range-btn" onclick="selectRange()">

let words = [];

let selectedRange = [];

let current = 0;

let correct = 0;

let wrong = 0;

let wrongWords = [];

let skipped = false;



let recognition = null;

let isListening = false;

let resultTimer = null;

let isChecking = false;



const wordDiv =
document.getElementById("word");

const resultDiv =
document.getElementById("result");





// =======================
// 显示词汇
// =======================

function showWord(){


if(words[current]){


wordDiv.innerText =
words[current];


}

else{


wordDiv.innerText =
"请选择词汇";


}

resultDiv.innerHTML="";

skipped = false;

document.body.className="normal";


}






// =======================
// 开始朗读
// =======================

function startListening(){



if(isListening){

return;

}



const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("请使用 Google Chrome 浏览器");

return;

}




recognition =
new SpeechRecognition();



recognition.lang =
"en-US";



// 持续监听

recognition.continuous = true;



// 即时结果

recognition.interimResults = false;



isListening = true;



recognition.start();



resultDiv.innerHTML =
"🎧 正在听...";





// =======================
// 收到语音
// =======================


recognition.onresult=function(event){



let text="";



for(
let i=0;
i<event.results.length;
i++
){


text +=
event.results[i][0].transcript;


}



text =
text.trim();



resultDiv.innerHTML =
"听到：" + removeWordRepeat(text);




// 延迟判断
// 给单字更多时间


clearTimeout(resultTimer);



resultTimer =
setTimeout(()=>{


checkAnswer(text);


},800);



};







// =======================
// Chrome 自动停止后重新开启
// =======================


recognition.onend=function(){


if(isListening){


try{


recognition.start();


}

catch(e){}



}



};






recognition.onerror=function(){


};




}











// =======================
// 停止朗读
// =======================

function stopListening(){



isListening=false;



if(recognition){


recognition.stop();


recognition=null;


}



}



// =======================
// 不会，跳过下一题
// =======================

function skipWord(){


stopListening();


// 记录跳过 = 错误

wrong++;

wrongWords.push(
words[current]
);


// 背景变红

document.body.className =
"incorrect";


resultDiv.innerHTML =
"➡️ 跳过：" + words[current];



setTimeout(()=>{


current++;


if(current < words.length){

showWord();

}

else{

showResult();

}


},800);


}



// =======================
// 判断答案
// =======================


function checkAnswer(text){


if(isChecking){
    return;
}


isChecking = true;



if(!words[current]){

return;

}




let answer =
words[current];




// 去除重复

let cleanText =
text.trim();


console.log(
"学生:",
cleanText,
"答案:",
answer
);



let similarity = getSimilarity(
cleanText.toLowerCase(),
answer.toLowerCase()
);


if(similarity >= 0.7){

stopListening();

isChecking = false;



correct++;



document.body.className =
"correct";



resultDiv.innerHTML =
"✅ 正确！";



setTimeout(()=>{


current++;



if(current < words.length){


showWord();


}

else{


showResult();


}



},800);




}

else{


isChecking = false;


// 保留错误背景

document.body.className =
"incorrect";


resultDiv.innerHTML =
"❌ 再试一次";


}



}








// =======================
// 过滤重复
// 猫猫猫 -> 猫
// =======================


function removeRepeat(text){



if(text.length<=1){

return text;

}



let result="";



for(let i=0;i<text.length;i++){


if(text[i] !== text[i-1]){


result += text[i];


}


}



return result;



}







// =======================
// 完成统计
// =======================

function showResult(){


wordDiv.innerText =
"🎊";

// 清除答题背景颜色

document.body.className="";

// 隐藏按钮

document.getElementById("startBtn").style.display="none";

document.getElementById("stopBtn").style.display="none";

document.getElementById("skipBtn").style.display="none";


// 计算正确率

let accuracy =
Math.round(
(correct / words.length) * 100
);


// 判断是否通过

let statusHTML = "";


if(accuracy >= 80){


statusHTML = `

<div class="pass-box">

🎉<br>

<span>PASS</span>

<br>

<span class="pass-small">

优秀！继续保持

</span>

</div>

`;


}
else{


statusHTML = `

<div class="fail-box">

💪<br>

<span>FAIL</span>

<br>

<span class="fail-small">

继续努力，加油！

</span>

</div>

`;

}



resultDiv.innerHTML =

`
完成！<br><br>

${statusHTML}

<br><br>

📝 总题数：${words.length}<br>

✅ 正确：${correct}<br>

❌ 错误：${wrong}<br><br>

📊 正确率：${accuracy}%<br><br>

<div class="wrong-list">

${

wrongWords.length>0

?

"错题："+wrongWords.join("，")

:

"没有错题"

}

</div>

`;



}

// 重新开始
// =======================

function restart(){


words =
shuffle([...selectedRange]);


current=0;

correct=0;

wrong=0;

wrongWords=[];


// 显示朗读按钮

document.getElementById("startBtn").style.display="inline-block";

document.getElementById("stopBtn").style.display="inline-block";

document.getElementById("skipBtn").style.display="inline-block";


showWord();


}







function shuffle(array){


return array.sort(
()=>Math.random()-0.5
);


}

function removeWordRepeat(text){

let half = text.length / 2;

let first = text.substring(0,half);

let second = text.substring(half);


if(first === second){

return first;

}

return text;

}








// =======================
// 选择范围
// =======================

function selectRange(){



let start =
prompt(
"请输入开始词汇"
);



let end =
prompt(
"请输入结束词汇"
);



let startIndex =
originalWords.indexOf(start);



let endIndex =
originalWords.indexOf(end);




if(
startIndex===-1 ||
endIndex===-1 ||
startIndex>endIndex
){


alert("词汇不存在");


return;


}




selectedRange =
originalWords.slice(
startIndex,
endIndex+1
);



restart();



}

// =======================
// 英文发音相似度判断
// =======================

function getSimilarity(a,b){

    if(a.includes(b) || b.includes(a)){
        return 1;
    }


    let longer =
    a.length > b.length ? a : b;


    let shorter =
    a.length > b.length ? b : a;


    let longerLength =
    longer.length;


    if(longerLength === 0){
        return 1;
    }


    let distance =
    levenshtein(longer, shorter);


    return (
        longerLength - distance
    ) / longerLength;

}



// 编辑距离算法

function levenshtein(a,b){

let matrix=[];


for(let i=0;i<=b.length;i++){

matrix[i]=[i];

}


for(let j=0;j<=a.length;j++){

matrix[0][j]=j;

}



for(let i=1;i<=b.length;i++){

for(let j=1;j<=a.length;j++){


if(
b.charAt(i-1)
===
a.charAt(j-1)
){

matrix[i][j]=matrix[i-1][j-1];

}

else{


matrix[i][j]=Math.min(

matrix[i-1][j-1]+1,

matrix[i][j-1]+1,

matrix[i-1][j]+1

);


}


}

}


return matrix[b.length][a.length];

}




// 初始加载

selectedRange =
[...originalWords];


restart();
