<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<title>
Moon AI 汉字朗读 V5.5
</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{

margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:"Microsoft YaHei";

}


.word{

font-size:120px;

}


.pinyin{

font-size:35px;
color:#666;
margin:20px;

}



button{

font-size:24px;
padding:15px 30px;
margin:8px;
border:none;
border-radius:10px;
cursor:pointer;

}


.start{

background:#2196F3;
color:white;

}


.stop{

background:#f44336;
color:white;

}


.submit{

background:#4CAF50;
color:white;

}


.result{

font-size:28px;
margin-top:30px;

}



.correct{

background:#c8f7c5;

}



.wrong{

background:#ffcdd2;

}


</style>

</head>


<body>



<div class="word" id="word">

</div>


<div class="pinyin" id="pinyin">

</div>



<button class="start" onclick="startRecording()">

🎤 开始录音

</button>


<button class="stop" onclick="stopRecording()">

⏹ 结束录音

</button>


<button class="submit" onclick="submitAnswer()">

📤 提交判断

</button>



<div class="result" id="result">

等待开始

</div>





<script>


const words=[


{
word:"猫",
pinyin:"māo"
},


{
word:"狗",
pinyin:"gǒu"
},


{
word:"马",
pinyin:"mǎ"
},


{
word:"鸟",
pinyin:"niǎo"
},


{
word:"鱼",
pinyin:"yú"
}


];



let current=0;


let mediaRecorder;

let audioChunks=[];

let audioBlob=null;

let stream=null;



let recognitionResult="";





const wordDiv=
document.getElementById("word");


const pinyinDiv=
document.getElementById("pinyin");


const resultDiv=
document.getElementById("result");





function showWord(){


wordDiv.innerHTML=
words[current].word;


pinyinDiv.innerHTML=
words[current].pinyin;


resultDiv.innerHTML=
"等待朗读";


document.body.className="";


audioBlob=null;


}




// 开始录音

async function startRecording(){


audioChunks=[];


recognitionResult="";



try{


stream =
await navigator.mediaDevices.getUserMedia({

audio:true

});



mediaRecorder =
new MediaRecorder(stream);



mediaRecorder.ondataavailable=function(e){


if(e.data.size>0){

audioChunks.push(e.data);

}


};




mediaRecorder.onstop=function(){


audioBlob =
new Blob(
audioChunks,
{
type:"audio/webm"
}
);



resultDiv.innerHTML=
"✅ 录音完成，请提交判断";


};




mediaRecorder.start();



resultDiv.innerHTML=
"🎧 正在录音...";



}

catch(error){


resultDiv.innerHTML=
"❌ 无法使用麦克风";


}



}




// 停止录音

function stopRecording(){



if(mediaRecorder &&
mediaRecorder.state!=="inactive"){



mediaRecorder.stop();



stream.getTracks().forEach(track=>{

track.stop();

});


}


}





// 提交判断

function submitAnswer(){



if(!audioBlob){


resultDiv.innerHTML=
"请先录音";


return;


}



// 这里暂时模拟判断

startSpeechCheck();



}






// 用语音识别读取录音内容

function startSpeechCheck(){



const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){


alert("请使用Chrome");


return;


}




let recognition =
new SpeechRecognition();



recognition.lang="zh-CN";


recognition.interimResults=false;


recognition.start();



resultDiv.innerHTML=
"🤖 AI分析中...";



recognition.onresult=function(event){


let answer =
event.results[0][0].transcript.trim();



let correct =
words[current].word;



console.log(answer);



if(answer.includes(correct)){



document.body.className="correct";


resultDiv.innerHTML=
"✅ 正确！";



setTimeout(()=>{


current++;



if(current < words.length){

showWord();

}
else{


wordDiv.innerHTML="🎉";

pinyinDiv.innerHTML="完成";

resultDiv.innerHTML=
"全部完成";


}


},1000);



}



else{


document.body.className="wrong";


resultDiv.innerHTML=

`
❌ 错误<br>
系统听到：${answer}
`;



}



};



}





showWord();



</script>


</body>

</html>
