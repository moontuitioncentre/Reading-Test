<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<title>Moon AI 汉字朗读完整版</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei";
}


.word{
    font-size:120px;
}


.pinyin{
    font-size:35px;
    color:#666;
    margin:20px;
}


button{

    font-size:22px;
    padding:15px 30px;
    margin:8px;
    border:none;
    border-radius:10px;
}


.start{
    background:#2196F3;
    color:white;
}


.stop{
    background:#f44336;
    color:white;
}


.submit{
    background:#4CAF50;
    color:white;
}


.result{

    font-size:28px;
    margin-top:25px;

}


audio{

    margin-top:20px;

}


</style>


</head>


<body>



<div class="word" id="word"></div>

<div class="pinyin" id="pinyin"></div>



<button class="start" onclick="startRecording()">
🎤 开始录音
</button>


<button class="stop" onclick="stopRecording()">
⏹ 结束录音
</button>


<button class="submit" onclick="submitAnswer()">
📤 提交判断
</button>


<div id="result" class="result">
等待开始
</div>


<div id="audioArea"></div>



<script>


const words=[

{
word:"猫",
pinyin:"māo"
},

{
word:"狗",
pinyin:"gǒu"
},

{
word:"马",
pinyin:"mǎ"
},

{
word:"鸟",
pinyin:"niǎo"
},

{
word:"鱼",
pinyin:"yú"
}

];


let current=0;

let recorder;

let chunks=[];

let audioBlob=null;

let audioURL=null;

let stream=null;



const word=
document.getElementById("word");

const pinyin=
document.getElementById("pinyin");

const result=
document.getElementById("result");

const audioArea=
document.getElementById("audioArea");





function showWord(){

word.innerHTML=
words[current].word;


pinyin.innerHTML=
words[current].pinyin;


result.innerHTML=
"等待朗读";


audioArea.innerHTML="";


audioBlob=null;


}




async function startRecording(){


chunks=[];

audioArea.innerHTML="";


try{


stream =
await navigator.mediaDevices.getUserMedia({

audio:true

});



recorder =
new MediaRecorder(stream);



recorder.ondataavailable=function(e){


if(e.data.size>0){

chunks.push(e.data);

}


};



recorder.onstop=function(){


audioBlob =
new Blob(
chunks,
{
type:"audio/webm"
}
);



audioURL =
URL.createObjectURL(audioBlob);



audioArea.innerHTML=

`
<audio controls>
<source src="${audioURL}">
</audio>
`;



result.innerHTML=
"✅ 录音完成，请提交判断";


};



recorder.start();



result.innerHTML=
"🎧 正在录音...";


}

catch(e){


result.innerHTML=
"❌ 麦克风失败";


}



}





function stopRecording(){


if(recorder &&
recorder.state==="recording"){


recorder.stop();


stream.getTracks().forEach(track=>{

track.stop();

});


}



}





async function submitAnswer(){



if(!audioBlob){

result.innerHTML=
"请先录音";

return;

}



result.innerHTML=
"🤖 AI分析中...";



// =================================
// 未来这里连接 Azure Speech
// 现在模拟
// =================================



setTimeout(()=>{


let fakeResult=true;



if(fakeResult){


result.innerHTML=
"✅ 正确！";


setTimeout(()=>{


current++;


if(current<words.length){

showWord();

}
else{


word.innerHTML="🎉";

pinyin.innerHTML="完成";

result.innerHTML=
"全部完成";

}



},1000);



}else{


result.innerHTML=
"❌ 错误，请重新录音";


}



},1500);



}





showWord();


</script>


</body>

</html>
