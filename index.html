<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI词汇朗读测试</title>

<style>

body{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
}

#word{
    font-size:100px;
    margin-bottom:50px;
}

button{
    font-size:30px;
    padding:15px 40px;
    border-radius:10px;
}

#result{
    font-size:30px;
    margin-top:30px;
}

</style>

</head>


<body>


<div id="word">学校</div>

<button onclick="startListening()">
🎤 开始朗读
</button>


<div id="result"></div>



<script>


let words=[
"一",
"二",
"三",
"学校",
"老师",
"学生",
"朋友"
];


let current=0;



function showWord(){

document.getElementById("word").innerText=
words[current];

}




function startListening(){


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("你的浏览器不支持");

return;

}



let recognition =
new SpeechRecognition();



recognition.lang="zh-CN";

recognition.continuous=false;

recognition.interimResults=false;



document.getElementById("result").innerText=
"🎤 正在听...";


recognition.start();



recognition.onresult=function(event){


let answer =
event.results[0][0].transcript.trim();



let correct =
words[current];



console.log(answer);



if(answer.includes(correct)){


document.getElementById("result").innerText=
"✅ 正确";


}else{


document.getElementById("result").innerText=
"❌ 听到："+answer;


}



setTimeout(()=>{


current++;


if(current<words.length){

showWord();

document.getElementById("result").innerText="";

}else{

document.getElementById("word").innerText="完成🎉";

}


},1000);



};



recognition.onerror=function(event){

alert("错误："+event.error);

};



}




showWord();


</script>


</body>
</html>
