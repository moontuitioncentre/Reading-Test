<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<title>Moon AI 汉字朗读 V6.1</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei";
    transition:0.3s;
}


.word{
    font-size:120px;
}


.pinyin{
    font-size:35px;
    color:#666;
    margin:20px;
}


button{

    font-size:22px;
    padding:15px 30px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;

}


.start{

    background:#2196F3;
    color:white;

}


.stop{

    background:#f44336;
    color:white;

}


.submit{

    background:#4CAF50;
    color:white;

}


.result{

    font-size:28px;
    margin-top:25px;

}


audio{

    margin-top:20px;

}


.correct{

    background:#c8f7c5;

}


.wrong{

    background:#ffcdd2;

}


</style>

</head>


<body>


<div class="word" id="word"></div>


<div class="pinyin" id="pinyin"></div>



<button class="start" onclick="startRecording()">

🎤 开始朗读

</button>



<button class="stop" onclick="stopRecording()">

⏹ 结束朗读

</button>



<button class="submit" onclick="submitAnswer()">

📤 提交判断

</button>



<div class="result" id="result">

等待开始

</div>


<div id="audioArea"></div>




<script>


const words=[

{
word:"猫",
pinyin:"māo"
},

{
word:"狗",
pinyin:"gǒu"
},

{
word:"马",
pinyin:"mǎ"
},

{
word:"鸟",
pinyin:"niǎo"
},

{
word:"鱼",
pinyin:"yú"
}

];



let current=0;


let mediaRecorder=null;

let audioChunks=[];

let audioBlob=null;

let stream=null;



const wordDiv=
document.getElementById("word");


const pinyinDiv=
document.getElementById("pinyin");


const resultDiv=
document.getElementById("result");


const audioArea=
document.getElementById("audioArea");





function showWord(){


wordDiv.innerHTML=
words[current].word;


pinyinDiv.innerHTML=
words[current].pinyin;


resultDiv.innerHTML=
"等待朗读";


audioArea.innerHTML="";


audioBlob=null;


document.body.className="";


}






async function startRecording(){


audioChunks=[];


audioArea.innerHTML="";


try{


stream =
await navigator.mediaDevices.getUserMedia({

audio:true

});



mediaRecorder =
new MediaRecorder(stream);



mediaRecorder.ondataavailable=function(e){


if(e.data.size>0){

audioChunks.push(e.data);

}


};





mediaRecorder.onstop=function(){


audioBlob =
new Blob(
audioChunks,
{
type:"audio/webm"
}
);



let url =
URL.createObjectURL(audioBlob);



audioArea.innerHTML=

`

<audio controls>

<source src="${url}" type="audio/webm">

</audio>

`;



resultDiv.innerHTML=
"✅ 录音完成，可以提交";


};





mediaRecorder.start();



resultDiv.innerHTML=
"🔴 正在录音...";


}

catch(error){


resultDiv.innerHTML=
"❌ 麦克风权限失败";


}


}







function stopRecording(){



if(mediaRecorder &&
mediaRecorder.state==="recording"){



mediaRecorder.stop();



stream.getTracks().forEach(track=>{

track.stop();

});


}



}








function submitAnswer(){



if(!audioBlob){


resultDiv.innerHTML=
"请先完成录音";


return;


}



resultDiv.innerHTML=
"🤖 分析中...";



// ============================
// 这里以后接 AI 判断
// 现在 Demo 模拟
// ============================



setTimeout(()=>{



let answer=true;



if(answer){


document.body.className="correct";


resultDiv.innerHTML=
"✅ 正确！";


setTimeout(()=>{


current++;


if(current < words.length){


showWord();


}

else{


wordDiv.innerHTML="🎉";

pinyinDiv.innerHTML="完成";

resultDiv.innerHTML=
"全部完成";


}



},1000);



}


else{


document.body.className="wrong";


resultDiv.innerHTML=
"❌ 错误，请重新朗读";


}



},1500);



}






showWord();



</script>


</body>

</html>
