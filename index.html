<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Moon AI 汉字朗读 V3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei";
    transition:.3s;
}

.word{
    font-size:120px;
}

.pinyin{
    font-size:35px;
    color:#666;
    margin:20px;
}

button{
    font-size:24px;
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.start{
    background:#2196F3;
    color:white;
}

.stop{
    background:#f44336;
    color:white;
}

.result{
    font-size:28px;
    margin-top:30px;
}


</style>

</head>


<body>


<div class="word" id="word">
马
</div>


<div class="pinyin" id="pinyin">
mǎ
</div>



<button class="start" onclick="startListening()">
🎤 开始朗读
</button>


<button class="stop" onclick="stopListening()">
⏹ 结束朗读
</button>



<div class="result" id="result">

</div>



<script>


const words=[

{
word:"马",
pinyin:"mǎ"
},

{
word:"鸟",
pinyin:"niǎo"
},

{
word:"鱼",
pinyin:"yú"
},

{
word:"猫",
pinyin:"māo"
}

];


let current=0;

let recognition;


const wordDiv=document.getElementById("word");
const pinyinDiv=document.getElementById("pinyin");
const resultDiv=document.getElementById("result");



function showWord(){

wordDiv.innerHTML=
words[current].word;

pinyinDiv.innerHTML=
words[current].pinyin;

resultDiv.innerHTML="";

}



function startListening(){


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("请使用 Chrome 浏览器");

return;

}



recognition =
new SpeechRecognition();


recognition.lang="zh-CN";


recognition.continuous=true;

recognition.interimResults=false;



recognition.start();



resultDiv.innerHTML=
"🎧 正在听...";



recognition.onresult=function(event){


let text="";


for(let i=0;i<event.results.length;i++){

text += event.results[i][0].transcript;

}


window.studentAnswer=text.trim();


};



recognition.onerror=function(){

resultDiv.innerHTML=
"❌ 没有听清";

};



}



function stopListening(){


if(!recognition){

return;

}


recognition.stop();



setTimeout(()=>{


let answer=
window.studentAnswer || "";


let correct=
words[current].word;



if(answer.includes(correct)){


document.body.style.background="#c8f7c5";


resultDiv.innerHTML=
"✅ 正确";


setTimeout(()=>{


current++;


if(current<words.length){

document.body.style.background="white";

showWord();


}else{

wordDiv.innerHTML="🎉";

pinyinDiv.innerHTML="完成";

}


},1000);



}else{


document.body.style.background="#ffcdd2";


resultDiv.innerHTML=
`
❌ 错误<br>
你读：${answer || "没有识别到"}
<br>
请再试一次
`;


}


},500);



}



showWord();


</script>


</body>
</html>
