<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Moon AI 汉字朗读 V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei";
}

.word{
    font-size:120px;
}

.pinyin{
    font-size:35px;
    color:#666;
    margin:20px;
}

button{
    font-size:25px;
    padding:15px 40px;
    border:none;
    border-radius:10px;
    background:#2196F3;
    color:white;
}

.result{
    font-size:30px;
    margin-top:30px;
}

</style>

</head>


<body>


<div class="word">
马
</div>

<div class="pinyin">
mǎ
</div>


<button onclick="startRecording()">
🎤 开始朗读
</button>


<div class="result" id="result">
</div>


<script>


let recorder;
let audioChunks=[];



async function startRecording(){


document.getElementById("result").innerHTML=
"🎧 正在听...";


audioChunks=[];


try{


let stream =
await navigator.mediaDevices.getUserMedia({
audio:true
});


recorder =
new MediaRecorder(stream);



recorder.ondataavailable=function(e){

audioChunks.push(e.data);

};



recorder.onstop=function(){


let audioBlob =
new Blob(audioChunks,{
type:"audio/webm"
});


let audioURL =
URL.createObjectURL(audioBlob);



document.getElementById("result").innerHTML=
`
✅ 录音完成<br>

<audio controls src="${audioURL}"></audio>
`;

};



recorder.start();



setTimeout(()=>{


recorder.stop();


stream.getTracks().forEach(track=>{
track.stop();
});


},1500);



}
catch(error){


document.getElementById("result").innerHTML=
"❌ 麦克风无法使用";


}


}


</script>


</body>
</html>
