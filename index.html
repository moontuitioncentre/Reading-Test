<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<title>
Moon AI 汉字朗读 V4.1
</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>


body {

    margin:0;

    font-family:"Noto Sans SC",
    "Microsoft YaHei",
    sans-serif;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    height:100vh;

    transition:0.3s;

}



.card {

    font-size:120px;

    margin-bottom:20px;

}



.pinyin {

    font-size:35px;

    color:#666;

    margin-bottom:30px;

}



button {

    font-size:24px;

    padding:12px 30px;

    margin:10px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}



.start-btn {

    background:#2196F3;

    color:white;

}



.stop-btn {

    background:#f44336;

    color:white;

}



.restart-btn {

    background:#333;

    color:white;

}



.range-btn {

    background:#4CAF50;

    color:white;

}



.skip-btn {

    background:#ff9800;

    color:white;

}



.result {

    font-size:28px;

    text-align:center;

    margin-top:20px;

}



.correct {

    background:#c8f7c5;

}



.incorrect {

    background:#ffcdd2;

}



.wrong-list {

    margin-top:20px;

    color:red;

    font-size:20px;

}



</style>

</head>



<body>



<div class="card" id="word">

开始

</div>


<div class="pinyin" id="pinyin">

</div>



<button class="start-btn" onclick="startListening()">

🎤 开始朗读

</button>



<button class="stop-btn" onclick="stopListening()">

⏹ 停止朗读

</button>



<button class="skip-btn" onclick="skipWord()">

➡️ 下一题

</button>



<div class="result" id="result">

</div>



<button class="restart-btn" onclick="restart()">

重新开始

</button>


<button class="range-btn" onclick="selectRange()">

选择词汇范围

</button>



<script>


// 第2部分 JavaScript 会接这里
const originalWords = [

"猫",
"狗",
"马",
"鸟",
"鱼",
"学校",
"老师",
"苹果"

];



let words = [];

let selectedRange = [];

let current = 0;

let correct = 0;

let wrong = 0;

let wrongWords = [];



let recognition = null;

let isListening = false;

let resultTimer = null;

let isChecking = false;



const wordDiv =
document.getElementById("word");


const pinyinDiv =
document.getElementById("pinyin");


const resultDiv =
document.getElementById("result");





// =======================
// 显示词汇
// =======================

function showWord(){


if(words[current]){


wordDiv.innerText =
words[current];


}

else{


wordDiv.innerText =
"请选择词汇";


}


pinyinDiv.innerText="";


resultDiv.innerHTML="";


document.body.className="";


}






// =======================
// 开始朗读
// =======================

function startListening(){



if(isListening){

return;

}



const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("请使用 Google Chrome 浏览器");

return;

}




recognition =
new SpeechRecognition();



recognition.lang =
"zh-CN";



// 持续监听

recognition.continuous = true;



// 即时结果

recognition.interimResults = true;



isListening = true;



recognition.start();



resultDiv.innerHTML =
"🎧 正在听...";





// =======================
// 收到语音
// =======================


recognition.onresult=function(event){



let text="";



for(
let i=0;
i<event.results.length;
i++
){


text +=
event.results[i][0].transcript;


}



text =
text.trim();



resultDiv.innerHTML =
"听到：" + text;




// 延迟判断
// 给单字更多时间


clearTimeout(resultTimer);



resultTimer =
setTimeout(()=>{


checkAnswer(text);


},800);



};







// =======================
// Chrome 自动停止后重新开启
// =======================


recognition.onend=function(){


if(isListening){


try{


recognition.start();


}

catch(e){}



}



};






recognition.onerror=function(){


};




}











// =======================
// 停止朗读
// =======================

function stopListening(){



isListening=false;



if(recognition){


recognition.stop();


recognition=null;


}



}



// =======================
// 不会，跳过下一题
// =======================

function skipWord(){


stopListening();


// 记录错题

wrong++;

wrongWords.push(
words[current]
);


// 显示提示

document.body.className =
"incorrect";


resultDiv.innerHTML =
"➡️ 跳过：" + words[current];


// 下一题

setTimeout(()=>{


current++;


if(current < words.length){


showWord();


}

else{


showResult();


}


},800);



}



// =======================
// 判断答案
// =======================


function checkAnswer(text){


if(isChecking){
    return;
}


isChecking = true;



if(!words[current]){

return;

}




let answer =
words[current];




// 去除重复

let cleanText =
removeRepeat(text);



console.log(
"学生:",
cleanText,
"答案:",
answer
);





if(cleanText.includes(answer)){



stopListening();



isChecking = false;



correct++;



document.body.className =
"correct";



resultDiv.innerHTML =
"✅ 正确！";



setTimeout(()=>{


current++;



if(current < words.length){


showWord();


}

else{


showResult();


}



},800);




}

else{


isChecking = false;


document.body.className =
"incorrect";


resultDiv.innerHTML =
"❌ 再试一次";


}



}








// =======================
// 过滤重复
// 猫猫猫 -> 猫
// =======================


function removeRepeat(text){



if(text.length<=1){

return text;

}



let result="";



for(let i=0;i<text.length;i++){


if(text[i] !== text[i-1]){


result += text[i];


}


}



return result;



}







// =======================
// 完成统计
// =======================

function showResult(){


wordDiv.innerText =
"🎉";


resultDiv.innerHTML =

`
完成！<br><br>

✅ 正确：${correct}<br>

❌ 错误：${wrong}

<br><br>

<div class="wrong-list">

${

wrongWords.length>0

?

"错题："+wrongWords.join("，")

:

"没有错题"

}

</div>

`;



}








// =======================
// 重新开始
// =======================

function restart(){



words =
shuffle([...selectedRange]);



current=0;

correct=0;

wrong=0;

wrongWords=[];



showWord();


}







function shuffle(array){


return array.sort(
()=>Math.random()-0.5
);


}








// =======================
// 选择范围
// =======================

function selectRange(){



let start =
prompt(
"请输入开始词汇"
);



let end =
prompt(
"请输入结束词汇"
);



let startIndex =
originalWords.indexOf(start);



let endIndex =
originalWords.indexOf(end);




if(
startIndex===-1 ||
endIndex===-1 ||
startIndex>endIndex
){


alert("词汇不存在");


return;


}




selectedRange =
originalWords.slice(
startIndex,
endIndex+1
);



restart();



}






// 初始加载

selectedRange =
[...originalWords];


restart();


</script>



</body>

</html>
