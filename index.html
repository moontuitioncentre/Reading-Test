<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Moon AI 汉字朗读 V4</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei";
    transition:.3s;
}


.word{
    font-size:120px;
}


.pinyin{
    font-size:35px;
    color:#666;
    margin:20px;
}


button{
    font-size:24px;
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}


.start{
    background:#2196F3;
    color:white;
}


.stop{
    background:#f44336;
    color:white;
}


.result{
    font-size:28px;
    margin-top:30px;
}


.correct{
    background:#c8f7c5;
}


.wrong{
    background:#ffcdd2;
}


</style>

</head>


<body>


<div class="word" id="word"></div>

<div class="pinyin" id="pinyin"></div>


<button class="start" onclick="startListening()">
🎤 开始朗读
</button>


<button class="stop" onclick="stopListening()">
⏹ 结束朗读
</button>


<div class="result" id="result">
</div>



<script>


const words=[

{
word:"猫",
pinyin:"māo"
},

{
word:"狗",
pinyin:"gǒu"
},

{
word:"马",
pinyin:"mǎ"
},

{
word:"鸟",
pinyin:"niǎo"
},

{
word:"鱼",
pinyin:"yú"
}

];



let current=0;

let recognition=null;

let isListening=false;

let studentAnswer="";



const wordDiv=
document.getElementById("word");

const pinyinDiv=
document.getElementById("pinyin");

const resultDiv=
document.getElementById("result");





function showWord(){


wordDiv.innerHTML=
words[current].word;


pinyinDiv.innerHTML=
words[current].pinyin;


resultDiv.innerHTML="";


document.body.className="";


}





function startListening(){


if(isListening)
return;



studentAnswer="";


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("请使用 Google Chrome");

return;

}



recognition =
new SpeechRecognition();



recognition.lang="zh-CN";


// 连续监听
recognition.continuous=true;


// 开启即时结果
recognition.interimResults=true;



isListening=true;



recognition.start();



resultDiv.innerHTML=
"🎧 正在听...";





recognition.onresult=function(event){



let text="";



for(
let i=0;
i<event.results.length;
i++
){

text +=
event.results[i][0].transcript;

}



text=text.trim();



studentAnswer=text;



resultDiv.innerHTML=
"听到：" + text;



checkAnswer(text);



};



recognition.onerror=function(){


resultDiv.innerHTML=
"❌ 没有听清";


};

}





function checkAnswer(text){


let correct=
words[current].word;



// 去掉重复，例如 猫猫猫
let clean=text.replace(
new RegExp(correct,"g"),
correct
);



if(clean.includes(correct)){


stopListening();



document.body.className="correct";


resultDiv.innerHTML=
"✅ 正确！";



setTimeout(()=>{


current++;



if(current < words.length){

showWord();

}else{


wordDiv.innerHTML="🎉";

pinyinDiv.innerHTML="完成";

resultDiv.innerHTML=
"全部完成";


}



},800);



}



}






function stopListening(){


if(recognition){


recognition.stop();


recognition=null;


}



isListening=false;


}





showWord();



</script>


</body>
</html>
